name: Sync Honk GeoData

on:
  schedule:
    # Run daily at 20:30 UTC (04:30 CST, 30 mins after sync-google-rules)
    - cron: '30 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build GeoData
        run: |
          python honk-rule/build_geodata.py

      - name: Check for changes and commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add honk-rule/
          if git diff --staged --quiet; then
            echo "No changes detected in honk-rule artifacts."
          else
            git commit -m "chore(geodata): daily auto-sync geosite & geoip [skip ci]"
            git push
          fi
